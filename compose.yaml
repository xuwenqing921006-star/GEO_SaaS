services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - edge
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        unset MIGRATION_DB_USER MIGRATION_DB_PASSWORD &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips='*'
    environment:
      APP_ENV: "${APP_ENV:-development}"
      APP_VERSION: "${APP_VERSION:-0.1.0}"
      APP_MASTER_KEY: "${GEO_APP_MASTER_KEY:-}"
      MODEL_EXECUTION_MODE: "${MODEL_EXECUTION_MODE:-live}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-geo_saas}"
      DB_USER: "${GEO_APP_USER:-geo_app}"
      DB_PASSWORD: "${GEO_APP_PASSWORD:?GEO_APP_PASSWORD is required}"
      MIGRATION_DB_USER: "${GEO_MIGRATION_USER:-geo_migrator}"
      MIGRATION_DB_PASSWORD: "${GEO_MIGRATION_PASSWORD:?GEO_MIGRATION_PASSWORD is required}"
      STORAGE_ROOT: /data
      WORKER_HEARTBEAT_TIMEOUT_SECONDS: "${WORKER_HEARTBEAT_TIMEOUT_SECONDS:-20}"
    volumes:
      - geo_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - backend
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      APP_MASTER_KEY: "${GEO_APP_MASTER_KEY:-}"
      MODEL_EXECUTION_MODE: "${MODEL_EXECUTION_MODE:-live}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-geo_saas}"
      DB_USER: "${GEO_APP_USER:-geo_app}"
      DB_PASSWORD: "${GEO_APP_PASSWORD:?GEO_APP_PASSWORD is required}"
      STORAGE_ROOT: /data
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "${WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}"
    volumes:
      - geo_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib,time;
          p=pathlib.Path('/data/worker-heartbeat');
          raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 20 else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    image: "${GEO_IMAGE_PREFIX:-geo-saas}/postgres:${APP_VERSION:-0.1.0}"
    build:
      context: .
      dockerfile: backend/postgres/Dockerfile
    entrypoint: ["sh", "/usr/local/bin/geo-saas-start-postgres.sh"]
    command: ["postgres"]
    environment:
      APP_ENV: "${APP_ENV:-development}"
      POSTGRES_DB: "${POSTGRES_DB:-geo_saas}"
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}"
      GEO_APP_USER: "${GEO_APP_USER:-geo_app}"
      GEO_APP_PASSWORD: "${GEO_APP_PASSWORD:?GEO_APP_PASSWORD is required}"
      GEO_MIGRATION_USER: "${GEO_MIGRATION_USER:-geo_migrator}"
      GEO_MIGRATION_PASSWORD: "${GEO_MIGRATION_PASSWORD:?GEO_MIGRATION_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/postgres/start.sh:/usr/local/bin/geo-saas-start-postgres.sh:ro
      - ./backend/postgres/bootstrap-roles.sh:/usr/local/bin/geo-saas-bootstrap-roles.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/geo-saas-bootstrap-ready && pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-geo_saas}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

networks:
  edge: {}
  backend: { internal: true }

volumes:
  geo_data: {}
  postgres_data: {}
