x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: "${GEO_IMAGE_PREFIX:-geo-saas}/caddy:${APP_VERSION:-0.1.0}"
    build:
      context: .
      dockerfile: ops/Dockerfile.caddy
    restart: unless-stopped
    logging: *json-logging
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?APP_DOMAIN is required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  web:
    image: "${GEO_IMAGE_PREFIX:-geo-saas}/web:${APP_VERSION:-0.1.0}"
    restart: unless-stopped
    logging: *json-logging

  api:
    image: "${GEO_IMAGE_PREFIX:-geo-saas}/api:${APP_VERSION:-0.1.0}"
    restart: unless-stopped
    logging: *json-logging
    environment:
      BACKUP_STATUS_PATH: /backups/backup-status.json
    volumes:
      - backup_data:/backups:ro

  worker:
    image: "${GEO_IMAGE_PREFIX:-geo-saas}/worker:${APP_VERSION:-0.1.0}"
    restart: unless-stopped
    logging: *json-logging
    environment:
      BACKUP_STATUS_PATH: /backups/backup-status.json
      API_READINESS_URL: http://api:8000/api/v1/health/ready
    volumes:
      - backup_data:/backups:ro

  db:
    restart: unless-stopped
    logging: *json-logging

  backup:
    image: "${GEO_IMAGE_PREFIX:-geo-saas}/backup:${APP_VERSION:-0.1.0}"
    build:
      context: .
      dockerfile: ops/Dockerfile.backup
    restart: unless-stopped
    logging: *json-logging
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-geo_saas}"
      PGUSER: "${GEO_MIGRATION_USER:-geo_migrator}"
      PGPASSWORD: "${GEO_MIGRATION_PASSWORD:?GEO_MIGRATION_PASSWORD is required}"
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT is required}"
      BACKUP_DAILY_RETENTION_DAYS: "${BACKUP_DAILY_RETENTION_DAYS:-14}"
      BACKUP_WEEKLY_RETENTION_DAYS: "${BACKUP_WEEKLY_RETENTION_DAYS:-56}"
      APP_VERSION: "${APP_VERSION:-0.1.0}"
    volumes:
      - geo_data:/data:ro
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /work:rw,noexec,nosuid,size=2g

  restore:
    profiles: ["restore"]
    image: "${GEO_IMAGE_PREFIX:-geo-saas}/backup:${APP_VERSION:-0.1.0}"
    build:
      context: .
      dockerfile: ops/Dockerfile.backup
    entrypoint: ["/usr/local/bin/geo-restore"]
    logging: *json-logging
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-geo_saas}"
      PGUSER: "${GEO_MIGRATION_USER:-geo_migrator}"
      PGPASSWORD: "${GEO_MIGRATION_PASSWORD:?GEO_MIGRATION_PASSWORD is required}"
      BACKUP_FILE: "${BACKUP_FILE:-}"
      AGE_IDENTITY_FILE: "/run/secrets/backup_age_identity"
      CONFIRM_RESTORE: "${CONFIRM_RESTORE:-}"
    volumes:
      - geo_data:/data
      - backup_data:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /work:rw,noexec,nosuid,size=2g

volumes:
  caddy_data: {}
  caddy_config: {}
  backup_data: {}
